<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StaySuite — Hotel Management</title>
<style>
:root{--ink:#202b38;--muted:#788493;--line:#e8edf1;--bg:#f5f7f8;--white:#fff;--teal:#167d78;--teal2:#e5f3f1;--nav:#172a35;--gold:#d89b36;--red:#d85d5d;--blue:#557db5;--shadow:0 8px 28px #2437460b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:244px;background:var(--nav);color:#d7e1e5;padding:25px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 32px;color:#fff;font-weight:750;font-size:19px;letter-spacing:-.5px}.brand-mark{width:34px;height:34px;border-radius:11px;background:#2a928a;display:grid;place-items:center;color:white;font-size:19px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#82949e;padding:0 12px;margin:12px 0 9px}.nav button{width:100%;border:0;background:transparent;color:#b8c7ce;padding:11px 12px;border-radius:9px;text-align:left;display:flex;gap:12px;align-items:center;margin:3px 0}.nav button:hover,.nav button.active{background:#29414b;color:white}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;border-top:1px solid #344852;padding:17px 10px 0;color:#9eb0b8;font-size:12px}.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{font-weight:650;font-size:15px}.top-right{display:flex;align-items:center;gap:17px;color:var(--muted)}.avatar{height:34px;width:34px;border-radius:50%;background:#dcefeb;color:#246d67;display:grid;place-items:center;font-weight:700}.content{padding:30px 34px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px;gap:15px}.welcome h1{font-size:25px;letter-spacing:-.8px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.date{color:var(--muted);font-size:12px;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 19px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}.stat:hover{transform:translateY(-2px);border-color:#9acac5}.stat-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:var(--teal2);color:var(--teal);font-size:16px}.stat strong{display:block;font-size:27px;margin:10px 0 2px;letter-spacing:-1px}.stat small{color:var(--muted);font-size:11px}.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:17px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.panel h2{font-size:15px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.link{border:0;background:transparent;color:var(--teal);font-weight:650;font-size:12px}.room-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.room-mini{background:#f8fafb;border-radius:9px;padding:13px}.room-mini span{display:block;color:var(--muted);font-size:11px}.room-mini strong{font-size:20px;display:block;margin-top:4px}.bar{height:7px;background:#edf1f3;border-radius:9px;overflow:hidden;margin-top:15px;display:flex}.bar span{height:100%}.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8a96a1;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:650;padding:10px 9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid #f0f2f4;font-size:12px}tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:650;background:#eef2f4;color:#687783}.pill.confirmed,.pill.clean,.pill.completed{background:#e7f5ee;color:#25805b}.pill.pending,.pill.dirty{background:#fff4df;color:#a8731c}.pill.occupied{background:#e8effb;color:#4c70a6}.pill.cancelled{background:#fceaea;color:#bd5151}.activity{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #f0f2f4}.activity:last-child{border:0}.activity-icon{width:30px;height:30px;border-radius:9px;background:#eef5f4;display:grid;place-items:center}.activity b{font-size:12px}.activity small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.search{padding:9px 12px;border:1px solid var(--line);border-radius:8px;min-width:210px;background:#fff;outline:none}.search:focus,input:focus,select:focus{border-color:#83bdb7;outline:2px solid #dff1ef}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#fff;color:var(--ink);font-weight:600;font-size:12px}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn:hover{filter:brightness(.97)}.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.room-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.room-card-top{display:flex;justify-content:space-between;align-items:center}.room-no{font-weight:750;font-size:17px}.room-type{font-size:11px;color:var(--muted);margin:7px 0 12px}.room-card .pill{margin-bottom:8px}.room-rate{font-size:11px;color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.page-title{font-size:22px;margin:0 0 5px}.page-desc{color:var(--muted);margin:0 0 20px}.modal-backdrop{position:fixed;inset:0;background:#10212bb3;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:14px;width:min(480px,100%);padding:23px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 17px;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:650}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.mobile-menu{display:none;border:0;background:transparent;font-size:21px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid-main{grid-template-columns:1fr}.sidebar{width:210px}.content{padding:24px}}
@media(max-width:680px){.sidebar{position:fixed;z-index:5;left:-250px;top:0;bottom:0;transition:.2s;width:235px}.sidebar.open{left:0}.mobile-menu{display:block}.topbar{padding:0 17px;height:62px}.content{padding:20px 15px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.room-summary{grid-template-columns:repeat(2,1fr)}.welcome{flex-direction:column}.date{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand"><span class="brand-mark">⌂</span> StaySuite</div>
<div class="nav-label">WORKSPACE</div>
<nav class="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
<button data-page="rooms"><span class="ico">▤</span> Rooms</button>
<button data-page="reservations"><span class="ico">▣</span> Reservations</button>
<button data-page="guests"><span class="ico">♙</span> Guests</button>
<button data-page="housekeeping"><span class="ico">✧</span> Housekeeping</button>
<button data-page="payments"><span class="ico">₹</span> Payments</button>
</nav>
<div class="sidebar-foot">HOTEL OPERATIONS<br><strong style="color:#e5edef">Management workspace</strong></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="menuBtn">☰</button><span class="crumb" id="crumb">Dashboard</span></div><div class="top-right"><span id="today"></span><div class="avatar">A</div></div></header>
<div class="content" id="view"></div>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><h2 id="modalTitle">Add record</h2><form id="recordForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save record</button></div></form></div></div>
<script>
const today=new Date();document.getElementById('today').textContent=today.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const seed={rooms:Array.from({length:24},(_,i)=>({number:String(101+i),type:['Deluxe','Standard','Suite'][i%3],status:['occupied','clean','dirty','occupied','clean','clean'][i%6],rate:[3200,2200,5200][i%3]})),reservations:[{id:'RS-2401',guest:'Aarav Sharma',room:'102',checkin:today.toISOString().slice(0,10),checkout:new Date(Date.now()+86400000).toISOString().slice(0,10),status:'confirmed',amount:4400},{id:'RS-2402',guest:'Meera Iyer',room:'105',checkin:today.toISOString().slice(0,10),checkout:new Date(Date.now()+2*86400000).toISOString().slice(0,10),status:'confirmed',amount:6400},{id:'RS-2403',guest:'Kabir Rao',room:'108',checkin:today.toISOString().slice(0,10),checkout:new Date(Date.now()+86400000).toISOString().slice(0,10),status:'pending',amount:3200}],guests:[{name:'Aarav Sharma',phone:'+91 98765 43210',email:'aarav@example.com',visits:3},{name:'Meera Iyer',phone:'+91 98765 12340',email:'meera@example.com',visits:1}],tasks:[{room:'101',task:'Daily room cleaning',assigned:'Housekeeping team',status:'pending'},{room:'104',task:'Daily room cleaning',assigned:'Housekeeping team',status:'pending'},{room:'107',task:'Daily room cleaning',assigned:'Housekeeping team',status:'completed'}],payments:[{id:'PAY-001',guest:'Aarav Sharma',method:'UPI',amount:4400,date:today.toISOString().slice(0,10),status:'Paid'},{id:'PAY-002',guest:'Meera Iyer',method:'Card',amount:3200,date:today.toISOString().slice(0,10),status:'Paid'}]}};
let db;try{db=JSON.parse(localStorage.getItem('staysuite-data'))||seed}catch{db=seed}function save(){localStorage.setItem('staysuite-data',JSON.stringify(db))}
let page='dashboard',roomFilter='all',editing=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pill(s){return '<span class="pill '+String(s).toLowerCase()+'">'+esc(s)+'</span>'}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=p[0].toUpperCase()+p.slice(1);document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function stat(label,value,icon,note,action){return '<div class="stat" data-action="'+action+'"><div class="stat-head"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><strong>'+value+'</strong><small>'+note+'</small></div>'}
function dashboard(){let total=db.rooms.length,occ=db.rooms.filter(r=>r.status==='occupied').length,clean=db.rooms.filter(r=>r.status==='clean').length,dirty=db.rooms.filter(r=>r.status==='dirty').length,available=clean+dirty,arrivals=db.reservations.filter(r=>r.checkin===today.toISOString().slice(0,10)&&r.status==='confirmed').length;return '<div class="welcome"><div><h1>Good day, welcome back 👋</h1><p>Here is what is happening at your property today.</p></div><div class="date">◷ &nbsp; '+today.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+'</div></div><div class="stats">'+stat('Total Rooms',total,'▤','Rooms in your property','rooms')+stat('Occupied Rooms',occ,'▣',Math.round(occ/total*100)+'% occupancy','occupied')+stat('Available Rooms',available,'✓',clean+' clean · '+dirty+' dirty','available')+stat("Today's Arrivals",arrivals,'↘','Confirmed reservations only','reservations')+'</div><div class="grid-main"><div><section class="panel"><div class="panel-head"><div><h2>Room status overview</h2><div class="sub">Live snapshot of your room inventory</div></div><button class="link" data-go="rooms">View rooms →</button></div><div class="room-summary"><div class="room-mini"><span>Total rooms</span><strong>'+total+'</strong></div><div class="room-mini"><span>Occupied</span><strong>'+occ+'</strong></div><div class="room-mini"><span>Clean</span><strong>'+clean+'</strong></div><div class="room-mini"><span>Dirty</span><strong>'+dirty+'</strong></div></div><div class="bar"><span style="width:'+occ/total*100+'%;background:#6688bd"></span><span style="width:'+clean/total*100+'%;background:#39a37b"></span><span style="width:'+dirty/total*100+'%;background:#e0a444"></span></div><div class="legend"><span><i class="dot" style="background:#6688bd"></i>Occupied</span><span><i class="dot" style="background:#39a37b"></i>Clean</span><span><i class="dot" style="background:#e0a444"></i>Dirty</span></div></section><section class="panel"><div class="panel-head"><div><h2>Upcoming arrivals</h2><div class="sub">Confirmed reservations for today</div></div><button class="link" data-go="reservations">All reservations →</button></div>'+reservationTable(db.reservations.filter(r=>r.checkin===today.toISOString().slice(0,10)&&r.status==='confirmed').slice(0,5))+'</section></div><div><section class="panel"><div class="panel-head"><div><h2>Housekeeping</h2><div class="sub">Daily room cleaning tasks</div></div><button class="link" data-go="housekeeping">View all →</button></div>'+db.tasks.slice(0,4).map(t=>'<div class="activity"><span class="activity-icon">✧</span><div style="flex:1"><b>Room '+esc(t.room)+' · '+esc(t.task)+'</b><small>'+esc(t.assigned)+'</small></div>'+pill(t.status)+'</div>').join('')+'</section><section class="panel"><div class="panel-head"><div><h2>Quick actions</h2><div class="sub">Common front desk tasks</div></div></div><div style="display:grid;gap:9px"><button class="btn" data-add="reservation">＋ New reservation</button><button class="btn" data-add="guest">＋ Add guest</button><button class="btn" data-add="payment">＋ Record payment</button></div></section></div></div>'}
function reservationTable(rows){if(!rows.length)return '<div class="empty">No confirmed arrivals scheduled for today.</div>';return '<div class="table-wrap"><table><thead><tr><th>Booking ID</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Status</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.id)+'</b></td><td>'+esc(r.guest)+'</td><td>'+esc(r.room)+'</td><td>'+esc(r.checkin)+'</td><td>'+pill(r.status)+'</td></tr>').join('')+'</tbody></table></div>'}
function rooms(){let rows=db.rooms.filter(r=>roomFilter==='all'||(roomFilter==='available'?r.status!=='occupied':r.status===roomFilter));return '<h1 class="page-title">Rooms</h1><p class="page-desc">Manage room inventory, availability and housekeeping status.</p><div class="toolbar"><button class="btn '+(roomFilter==='all'?'primary':'')+'" data-filter="all">All rooms</button><button class="btn '+(roomFilter==='available'?'primary':'')+'" data-filter="available">Available ('+db.rooms.filter(r=>r.status!=='occupied').length+')</button><button class="btn '+(roomFilter==='clean'?'primary':'')+'" data-filter="clean">Clean</button><button class="btn '+(roomFilter==='dirty'?'primary':'')+'" data-filter="dirty">Dirty</button><button class="btn '+(roomFilter==='occupied'?'primary':'')+'" data-filter="occupied">Occupied</button></div><div class="room-grid">'+rows.map(r=>'<div class="room-card"><div class="room-card-top"><span class="room-no">'+esc(r.number)+'</span>'+pill(r.status)+'</div><div class="room-type">'+esc(r.type)+' Room</div><div class="room-rate">'+money(r.rate)+' / night</div><div style="margin-top:12px"><select class="room-status" data-room="'+esc(r.number)+'" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;font-size:11px"><option value="clean" '+(r.status==='clean'?'selected':'')+'>Clean</option><option value="dirty" '+(r.status==='dirty'?'selected':'')+'>Dirty</option><option value="occupied" '+(r.status==='occupied'?'selected':'')+'>Occupied</option></select></div></div>').join('')+'</div>'}
function reservations(){return '<h1 class="page-title">Reservations</h1><p class="page-desc">Track bookings, confirmation status and guest arrivals.</p><div class="toolbar"><input class="search" id="tableSearch" placeholder="Search guest or booking ID…"><button class="btn primary" data-add="reservation">＋ New reservation</button></div><section class="panel"><div id="reservationRows">'+reservationTable(db.reservations)+'</div></section>'}
function guests(){return '<h1 class="page-title">Guests</h1><p class="page-desc">Guest directory and contact information.</p><div class="toolbar"><input class="search" id="tableSearch" placeholder="Search guests…"><button class="btn primary" data-add="guest">＋ Add guest</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Guest</th><th>Phone</th><th>Email</th><th>Visits</th></tr></thead><tbody>'+db.guests.map(g=>'<tr><td><b>'+esc(g.name)+'</b></td><td>'+esc(g.phone)+'</td><td>'+esc(g.email)+'</td><td>'+g.visits+'</td></tr>').join('')+'</tbody></table></div></section>'}
function housekeeping(){return '<h1 class="page-title">Housekeeping</h1><p class="page-desc">Schedule and track daily cleaning for occupied rooms and room turnovers.</p><div class="toolbar"><button class="btn primary" data-add="task">＋ Add task</button><button class="btn" id="generateTasks">Generate daily occupied-room tasks</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Room</th><th>Task</th><th>Assigned to</th><th>Status</th><th>Action</th></tr></thead><tbody>'+db.tasks.map((t,i)=>'<tr><td><b>'+esc(t.room)+'</b></td><td>'+esc(t.task)+'</td><td>'+esc(t.assigned)+'</td><td>'+pill(t.status)+'</td><td><button class="link" data-task="'+i+'">'+(t.status==='completed'?'Reopen':'Mark done')+'</button></td></tr>').join('')+'</tbody></table></div></section>'}
function payments(){return '<h1 class="page-title">Payments</h1><p class="page-desc">Record and review payments collected at the hotel or online.</p><div class="toolbar"><button class="btn primary" data-add="payment">＋ Record payment</button></div><section class="panel"><div class="panel-head"><h2>Payment history</h2><strong>'+money(db.payments.reduce((s,p)=>s+Number(p.amount),0))+' collected</strong></div><div class="table-wrap"><table><thead><tr><th>Payment ID</th><th>Guest</th><th>Method</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+db.payments.map(p=>'<tr><td><b>'+esc(p.id)+'</b></td><td>'+esc(p.guest)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.date)+'</td><td>'+money(p.amount)+'</td><td>'+pill(p.status.toLowerCase())+'</td></tr>').join('')+'</tbody></table></div></section>'}
function render(){let v={dashboard,rooms,reservations,guests,housekeeping,payments}[page]();document.getElementById('view').innerHTML=v;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='available'){roomFilter='available';go('rooms')}else if(b.dataset.action==='occupied'){roomFilter='occupied';go('rooms')}else go(b.dataset.action)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{roomFilter=b.dataset.filter;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));document.querySelectorAll('.room-status').forEach(s=>s.onchange=()=>{let r=db.rooms.find(x=>x.number===s.dataset.room);r.status=s.value;save();render()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let t=db.tasks[Number(b.dataset.task)];t.status=t.status==='completed'?'pending':'completed';save();render()});let search=document.getElementById('tableSearch');if(search)search.oninput=()=>{let q=search.value.toLowerCase();if(page==='reservations'){let filtered=db.reservations.filter(r=>(r.guest+r.id+r.room).toLowerCase().includes(q));document.getElementById('reservationRows').innerHTML=reservationTable(filtered)}};let gen=document.getElementById('generateTasks');if(gen)gen.onclick=()=>{db.rooms.filter(r=>r.status==='occupied').forEach(r=>{if(!db.tasks.some(t=>t.room===r.number&&t.task==='Daily room cleaning'&&t.date===today.toISOString().slice(0,10)))db.tasks.push({room:r.number,task:'Daily room cleaning',assigned:'Housekeeping team',status:'pending',date:today.toISOString().slice(0,10)})});save();render()}}
const fields={reservation:[['guest','Guest name','text',true],['room','Room number','select',true],['checkin','Check-in date','date',true],['checkout','Check-out date','date',true],['status','Booking status','select',true],['amount','Total amount (₹)','number',true]],guest:[['name','Full name','text',true],['phone','Phone number','tel',true],['email','Email address','email',false],['visits','Number of visits','number',false]],payment:[['guest','Guest name','text',true],['method','Payment method','select',true],['amount','Amount (₹)','number',true],['date','Payment date','date',true]],task:[['room','Room number','select',true],['task','Task description','text',true],['assigned','Assigned to','text',true],['status','Task status','select',true]]};
function openForm(type){editing=type;document.getElementById('modalTitle').textContent={reservation:'New reservation',guest:'Add guest',payment:'Record payment',task:'Add housekeeping task'}[type];let html=fields[type].map(([name,label,kind,required])=>{let opts=kind==='select'?(name==='room'?db.rooms.map(r=>r.number).map(x=>'<option>'+esc(x)+'</option>').join(''):name==='status'?(type==='reservation'?'<option>confirmed</option><option>pending</option><option>cancelled</option>':'<option>pending</option><option>completed</option>'):name==='method'?'<option>Cash</option><option>UPI</option><option>Card</option><option>Online</option>':'') :'';let input=kind==='select'?'<select name="'+name+'" required>'+opts+'</select>':'<input name="'+name+'" type="'+kind+'" '+(required?'required':'')+(name==='amount'||name==='visits'?' min="0"':'')+' '+(name==='date'||name==='checkin'||name==='checkout'?'value="'+today.toISOString().slice(0,10)+'"':'')+'>';return '<div class="field '+(fields[type].length%2&&name===fields[type][fields[type].length-1][0]?'full':'')+'"><label>'+label+'</label>'+input+'</div>'}).join('');document.getElementById('formFields').innerHTML=html;document.getElementById('modal').classList.add('show')}
document.getElementById('cancelModal').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};
document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(editing==='reservation'){d.id='RS-'+Date.now().toString().slice(-6);d.amount=Number(d.amount);db.reservations.unshift(d)}if(editing==='guest'){d.visits=Number(d.visits||0);db.guests.unshift(d)}if(editing==='payment'){d.id='PAY-'+Date.now().toString().slice(-6);d.amount=Number(d.amount);d.status='Paid';db.payments.unshift(d)}if(editing==='task')db.tasks.unshift(d);save();document.getElementById('modal').classList.remove('show');render()};
render();
</script>
</body></html>
